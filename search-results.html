uct a &lt;tt class=&quot;inline-code&quot;&gt;FieldDescription&lt;/tt&gt; from the raw data packet&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.this.html</link></decl><decl id="540" type="property"><name>db</name><desc>&lt;div&gt;&lt;p&gt;Database name for column as string&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.db.html</link></decl><decl id="541" type="property"><name>table</name><desc>&lt;div&gt;&lt;p&gt;Table name for column as string - this could be an alias as in 'from tablename as foo'&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.table.html</link></decl><decl id="542" type="property"><name>originalTable</name><desc>&lt;div&gt;&lt;p&gt;Real table name for column as string&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.originalTable.html</link></decl><decl id="543" type="property"><name>name</name><desc>&lt;div&gt;&lt;p&gt;Column name as string - this could be an alias&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.name.html</link></decl><decl id="544" type="property"><name>originalName</name><desc>&lt;div&gt;&lt;p&gt;Real column name as string&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.originalName.html</link></decl><decl id="545" type="property"><name>charSet</name><desc>&lt;div&gt;&lt;p&gt;The character set in force&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.charSet.html</link></decl><decl id="546" type="property"><name>length</name><desc>&lt;div&gt;&lt;p&gt;The 'length' of the column as defined at table creation&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.protocol.packets.FieldDescription.length.html</link></decl><decl id="547" type="property"><name>type</name><desc>&lt;div&gt;&lt;p&gt;The type of the column hopefully (but not always) corresponding to enum &lt;tt class=&quot;inline-code&quot;&gt;mysql.protocol.constants.SQLType&lt;/tt&gt;.

="function"><name>setArgs</name><desc>&lt;div&gt;&lt;p&gt;Bind a Variant[] as the parameters of a prepared statement.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.prepared.Prepared.setArgs.2.html</link></decl><decl id="580" type="function"><name>getArg</name><desc>&lt;div&gt;&lt;p&gt;Prepared statement parameter getter.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.prepared.Prepared.getArg.html</link></decl><decl id="581" type="function"><name>setNullArg</name><desc>&lt;div&gt;&lt;p&gt;Sets a prepared statement parameter to NULL.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.prepared.Prepared.setNullArg.html</link></decl><decl id="582" type="function"><name>sql</name><desc>&lt;div&gt;&lt;p&gt;Gets the SQL command for this prepared statement.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.prepared.Prepared.sql.html</link></decl><decl id="583" type="property"><name>numArgs</name><desc>&lt;div&gt;&lt;p&gt;Gets the number of arguments this prepared statement expects to be passed in.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.prepared.Prepared.numArgs.html</link></decl><decl id="584" type="property"><name>lastInsertID</name><desc>&lt;div&gt;&lt;p&gt;After a command that inserted a row into a table with an auto-increment

><desc>&lt;div&gt;&lt;p&gt;Escape special characters in MySQL strings.&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.escape.html</link><decl id="610" type="function"><name>mysql_escape</name><desc>&lt;div&gt;&lt;p&gt;Simple escape function for dangerous SQL characters&lt;/p&gt;&lt;/div&gt;</desc><link>mysql.escape.mysql_escape.html</link></decl><decl id="611" type="struct"><name>MysqlEscape</name><desc>&lt;div&gt;&lt;p&gt;Struct to wrap around a string so it can be passed to formattedWrite and be
